name: CI

# いつ動かすか: main への push と、すべての Pull Request
on:
  push:
    branches: [main]
  pull_request:

# ワークフローが使える権限を最小（リポジトリの読み取りのみ）にする。
# 必要になったときだけ、ジョブごとに追加する。
permissions:
  contents: read

# 同じブランチで続けて push したとき、古い実行は取り消す（無駄な待ち時間を減らす）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 【アクションの固定について】
# アクションは、タグ（v7.0.1 など）で参照している。実際に動くコミットは
# .github/workflows/actions.lock に記録されており、GitHub Actions は記録されたコミットを実行する
# （タグが付け替えられても、記録されたコミットが使われる）。
# アクションを追加・変更したら、ローカルで `gh actions-lock` を実行して actions.lock も一緒にコミットする。
# 更新は Renovate が、actions.lock も含めて PR にしてくれる。

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # persist-credentials: false … チェックアウト後に認証情報を .git に残さない（pushしないので不要）。
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Go のバージョンは go.mod の記述に合わせる（ここに別の番号を書かない）。
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      # -race: データ競合の検出。-count=1: テスト結果のキャッシュを使わず毎回実行。
      - name: go test
        run: go test -race -count=1 ./...

  # Dockerfile が実際にビルドできることを確認する（イメージは公開しない）。
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: docker build
        run: docker build --tag iptv:ci .

  # actions.lock がワークフローの内容と一致していること、記録されたコミットが
  # 上流で確認できることを検証する（GitHub 公式の gh-actions-lock の --verify）。
  # uses を変更したのに actions.lock を更新し忘れると、ここで失敗する。
  lockfile:
    name: Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # --verify は GitHub の API で参照を確認するため、トークンが必要。
      GH_TOKEN: ${{ github.token }}
      # 拡張のバージョン。Renovate が更新を提案する（renovate.json の customManagers）。
      GH_ACTIONS_LOCK_VERSION: v0.5.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: gh-actions-lock のインストール
        run: gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"
      - name: actions.lock の検証
        run: gh actions-lock --verify

  # golangci-lint による静的解析。設定は .golangci.yml。
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # golangci-lint のバージョン。Renovate が更新を提案する（renovate.json の customManagers）。
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # ワークフロー自体の検査。actionlint は文法・型の誤り、zizmor はセキュリティ上の問題を見つける。
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 各ツールのバージョン。Renovate が更新を提案する（renovate.json の customManagers）。
      ACTIONLINT_VERSION: v1.7.12
      # zizmor は 1.32.0 以上が必要（actions.lock への対応が 1.32.0 から）。
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      # actionlint は run: 内のシェルを shellcheck で検査する（PATH にないと黙って省略される）。
      # 入っていることを確認し、なければここで失敗させる。
      - name: shellcheck の確認
        run: shellcheck --version

      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color

      - uses: astral-sh/setup-uv@v10.3.3

      # 指摘があると終了コード 11〜14 で失敗する。GH_TOKEN があるとオンライン監査も行う。
      - name: zizmor
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
